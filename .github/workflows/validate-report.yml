name: Validate Report

on:
  pull_request:
    paths:
      - "reports/**/*.md"
      - "templates/**/*.md"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/validate-report.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Test validator
        run: python -m unittest discover -s tests -v

      - name: Validate changed report frontmatter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git diff --name-only --diff-filter=ACMR -z "$BASE_SHA" HEAD -- 'reports/**/*.md' > /tmp/changed-reports
          while IFS= read -r -d '' file; do
            if [ "$(basename "$file")" = "README.md" ]; then
              continue
            fi
            python scripts/validate_frontmatter.py "$file"
          done < /tmp/changed-reports
